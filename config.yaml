# DASH Demo configuration
# 用于演示DASH完整流程

root: "/workspace"

# ===================== Step 0: 预处理 =====================
preprocess:
  # 原始数据目录
  raw_dir: "Demo/Test_dataset"
   # 数据处理模式：train（合并所有数据）或 test（单独处理每个数据）
  data_mode: "test"
  # 是否包含手动标注的漂白段标签（有标签用于训练，无标签用于预测）
  contain_label: true
  processed_dir: "output/step0_preprocess/{data_mode}"

# ===================== Step 1: 训练 =====================
train:
  lr: 0.005
  hidden_dim: 32
  num_layers: 3
  dropout: 0.2
  batch_size: 128
  num_epochs: 200
  resume_start: 0
  # 训练设备：cuda:0, cuda:1, ... 或 cpu
  device: "cuda:0"
  train_data_path: "/workspace/output/step0_preprocess/train"

# ===================== Step 2: 评估/测试 =====================
evaluate:
  # 模型名称 - 需要与train时一致
  ckpt: "lr0.005_hidden32_num_layers3_dropout0.2_batch_size128"
  # 加载的checkpoint
  load_ckpt: "epoch_89.pt"
  # 测试数据目录（绝对路径）
  test_data_path: "/workspace/output/step0_preprocess/test"

# ===================== Step 3: HMM =====================
hmm:
  # HMM输入fret数据目录
  fret_dir: "/workspace/output/step0_preprocess/test"
  # step2输出的pred_seg目录
  pred_seg_dir: "/workspace/output/eval"
  # 运行模式: "list"(列出文件), "single"(单个文件), "batch"(批量处理)
  mode: "single"
  # 处理的fret文件名（不含_fret.pkl），仅在mode="single"时有效
  # 例如: "20230305_dpb_20m_S1101_0000" 或 "data_fret"
  # 程序会自动在pred_seg_dir中查找对应的pred_seg文件
  file_name: "as0101_0000"

